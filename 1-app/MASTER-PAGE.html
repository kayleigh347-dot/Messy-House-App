<!--
  AGENT-ONLY MASTER PAGE — DO NOT EDIT THIS FILE.

  To add a page, copy this complete section into a new working file, edit the
  copy, then place the finished section in index.html. Do not alter this master.
  This app keeps its runtime pages as sections in index.html, so this is a
  copy-first page fragment, not a standalone URL or a second app entry point.

  Before wiring the copy into navigation, read AGENTS.md and
  LAYOUT-AND-NAVIGATION-RULES.md. Reuse an existing route or settings surface
  unless Kayleigh has asked for a new destination. Keep the global fixed
  Settings cog and Help shortcut in index.html; do not duplicate them here.
-->
<section id="newPageId" class="page hide">
  <div class="settings-heading">
    <h2>New page title</h2>
  </div>

  <!-- Keep tabs directly under the title. Remove this block when there are no tabs. -->
  <div class="folder-tabs" aria-label="New page sections">
    <button type="button" data-new-page-tab="main" aria-pressed="true">Main</button>
    <button type="button" data-new-page-tab="saved" aria-pressed="false">Saved</button>
  </div>

  <!-- Put the primary task or information here. Do not add a title tagline. -->
  <section class="card">
    <h3>Primary action</h3>
    <button type="button">Primary action</button>
  </section>

  <!-- Secondary controls stay collapsed until they are needed. -->
  <details class="optional-section">
    <summary>More options</summary>
    <div class="optional-fields">
      <button type="button">Secondary action</button>
    </div>
  </details>

  <p id="newPageStatus" role="status" aria-live="polite"></p>
</section>
